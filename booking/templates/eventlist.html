{% extends 'base.html' %}

{% block content %}
    <h1>Events</h1>
  <div class="grid">
    {% for event in events %}
      <article class="category">
        <div class="placeholder"></div>
        <span class="badge"> {{ event.category }} </span>
        <h3> {{ event.name }} </h3>
        <p> {{event.datetime}} at {{event.venue}} </p>

        <div class="ticket-stub">
          <span class="price"> Rs. {{ event.ticketprice }}</span>
          <a class="btn" href="{% url 'booking:events_book' event.id %}">Book</a>
        </div>
      </article>
    {% empty %}
      <p class="muted">No events right now. Check back soon.</p>
    {% endfor %}
  </div>
{% endblock %}
