{% extends 'base.html' %}

{% block content %}
<div>
    <a class="back" href="{% url 'users:home' %}">← Back to Dashboard</a>
</div>
    <section class="event-card">
        
    <h1>Add money to your wallet</h1>
    <div>Current balance: Rs. {{user.balance}} </div>

    {% if error_msg %}
        <p> {{ error_msg }} </p>
    {% endif %}

    <form class="form" action="{% url 'users:addmoney' %}" method="POST">
        {% csrf_token %}
        <input type="number" name="added_balance" placeholder="Enter the amount you want to add">
        <input class="btn" type="submit" name="Add">    
    </form>

</section>
{% endblock %}
