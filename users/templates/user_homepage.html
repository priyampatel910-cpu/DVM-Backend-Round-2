{% extends 'base.html' %}

{% block content %}
    <h1>You are signed in!</h1>
    <div>
        Username: {{ user.username }}
        Balance: {{ user.balance }}
    </div>

    <div>
        <a href="{% url 'booking:events_index' %}">View events</a>
    </div>
    <div>
        <h3>My events</h3>
        <ul>
            {% for event in events %}
                <li> {{event.name}} </li>
            {% empty %}
                <li>No events booked.</li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
