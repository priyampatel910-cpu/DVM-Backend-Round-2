{% extends 'organizer_base.html' %}

{% block content %}
    {% if events %}
        <ul>
            {% for event in events %}
                <li> {{event.name}} </li>
            {% empty %}
                <li>You have no organized events right now.</li>

            {% endfor %}
    {% endif %}

    <br>

    <div>
        <a href="{% url 'users:addevent' %}">Add an event</a>
    </div>

{% endblock %}
